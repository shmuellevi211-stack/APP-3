apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion '28.0.3'
    defaultConfig {
        applicationId 'org.zochrim.imitzaphim'
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 1
        versionName '0.1.0'
