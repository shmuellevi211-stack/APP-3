apply plugin: 'com.android.application'

android {
    namespace 'org.zochrim.imitzaphim'
    compileSdkVersion 33
    buildToolsVersion '33.0.2'

    defaultConfig {
        applicationId 'org.zochrim.imitzaphim'
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 2
        versionName '2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Keep the source icon as text in Git so it can be maintained via GitHub's text-file API.
// The build task materializes the real PNG resource before Android resource processing.
tasks.register('decodeLauncherIcon') {
    def sourceIcon = file('icon-src/ic_launcher.png.b64')
    def targetIcon = file('src/main/res/drawable-nodpi/ic_launcher.png')
    inputs.file(sourceIcon)
    outputs.file(targetIcon)
    doLast {
        targetIcon.parentFile.mkdirs()
        String encoded = sourceIcon.getText('UTF-8').replaceAll('\\s', '')
        targetIcon.bytes = java.util.Base64.getDecoder().decode(encoded)
    }
}
tasks.named('preBuild').configure {
    dependsOn('decodeLauncherIcon')
}
