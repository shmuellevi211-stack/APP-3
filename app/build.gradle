apply plugin: 'com.android.application'

android {
    namespace 'org.zochrim.imitzaphim'
    compileSdkVersion 33
    buildToolsVersion '33.0.2'

    defaultConfig {
        applicationId 'org.zochrim.imitzaphim'
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 14
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Materialize source artwork from text files before Android resource processing.
tasks.register('decodeLauncherAssets') {
    def sourceTemple = file('icon-src/temple_cutout.png.b64')
    def targetIcon = file('src/main/res/drawable-nodpi/ic_launcher.png')
    def targetWidgetScene = file('src/main/res/drawable-nodpi/widget_temple_scene.png')
    inputs.file(sourceTemple)
    outputs.files(targetIcon, targetWidgetScene)
    doLast {
        targetIcon.parentFile.mkdirs()
        targetWidgetScene.parentFile.mkdirs()
        String encodedTemple = sourceTemple.getText('UTF-8').replaceAll('\\s', '')
        byte[] imageBytes = java.util.Base64.getDecoder().decode(encodedTemple)
        targetIcon.bytes = imageBytes
        targetWidgetScene.bytes = imageBytes
    }
}
tasks.named('preBuild').configure {
    dependsOn('decodeLauncherAssets')
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
