apply plugin: 'com.android.application'

android {
    namespace 'org.zochrim.imitzaphim'
    compileSdkVersion 33
    buildToolsVersion '33.0.2'

    defaultConfig {
        applicationId 'org.zochrim.imitzaphim'
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
